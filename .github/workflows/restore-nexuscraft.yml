
name: Restore NEXUSCRAFT folder structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          set -e
          test -f NEXUSCRAFT-2.0-HYBRID.zip
          mkdir -p /tmp/nexuscraft-restore
          unzip -o NEXUSCRAFT-2.0-HYBRID.zip -d /tmp/nexuscraft-restore
          test -d /tmp/nexuscraft-restore/NEXUSCRAFT/public
          test -f /tmp/nexuscraft-restore/NEXUSCRAFT/agent/agent.js
          cp -a /tmp/nexuscraft-restore/NEXUSCRAFT/. .
          rm -f NEXUSCRAFT-2.0-HYBRID.zip

      - name: Commit restored files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          git add -A
          git commit -m "Restore NEXUSCRAFT folder structure"
          git push
